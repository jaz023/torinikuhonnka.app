<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昼飯発注/午餐訂購</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
  <img src="images/sumitomo.png" class="logo">
    <h2>オンラインオーダー/線上點餐</h2>
    <form id="orderForm">

  <div id="loadingSpinner" class="spinner" style="display:none;"></div>

  <div class="form-group">
    <label for="name">名前/姓名：</label>
      <input type="text" class="form-input name" id="name" placeholder="名前入力/輸入姓名">
  </div>

      <div class="menu-item">
        <img src="images/chashutori.png" alt="チャーシューとり弁当">
        <div class="info">
          <h3>チャーシューとり弁当/秘製叉燒雞便當</h3>

          <p class="price" data-price="178">金額：178</p>

          <select class="qty" name="qty[]" data-item="チャーシューとり弁当/秘製叉燒雞便當">
           <option value="0">0</option>
           <option value="1">1</option>
           <option value="2">2</option>
           <option value="3">3</option>
           <option value="4">4</option>
           <option value="5">5</option>
           <option value="6">6</option>
           <option value="7">7</option>
           <option value="8">8</option>
           <option value="9">9</option>
           <option value="10">10</option>
           <option value="other">その他/其他</option>
         </select>
          <input type="number" name="qty_input[]" class="qty-input" style="display:none;" min="0" max="99" value="0" />
          <input type="text" name="note[]" placeholder="備考" class="note">
        </div>
      </div>

      <div class="menu-item">
        <img src="images/garibatayakibuta.png" alt="ガーリックバタ焼き豚弁当">
        <div class="info">
          <h3>ガーリックバタ焼き豚弁当/香蒜奶油烤豬排便當</h3>

          <p class="price" data-price="150">金額：150</p>

          <select class="qty" name="qty[]" data-item="ガーリックバタ焼き豚弁当/香蒜奶油烤豬排便當">
          <option value="0">0</option>
           <option value="1">1</option>
           <option value="2">2</option>
           <option value="3">3</option>
           <option value="4">4</option>
           <option value="5">5</option>
           <option value="6">6</option>
           <option value="7">7</option>
           <option value="8">8</option>
           <option value="9">9</option>
           <option value="10">10</option>
           <option value="other">その他/其他</option>
         </select>
          <input type="number" name="qty_input[]" class="qty-input" style="display:none;" min="0" max="99" value="0" />
          <input type="text" name="note[]" placeholder="備考" class="note">
        </div>
      </div>

      <div class="menu-item">
        <img src="images/garibata.png" alt="味噌焼き白身魚弁当">
        <div class="info">
          <h3>味噌焼き白身魚弁当/京燒味增鮮鱸魚便當</h3>

          <p class="price" data-price="198">金額：198</p>

          <select class="qty" name="qty[]" data-item="味噌焼き白身魚弁当/京燒味增鮮鱸魚便當">
           <option value="0">0</option>
           <option value="1">1</option>
           <option value="2">2</option>
           <option value="3">3</option>
           <option value="4">4</option>
           <option value="5">5</option>
           <option value="6">6</option>
           <option value="7">7</option>
           <option value="8">8</option>
           <option value="9">9</option>
           <option value="10">10</option>
           <option value="other">その他/其他</option>
         </select>
          <input type="number" name="qty_input[]" class="qty-input" style="display:none;" min="0" max="99" value="0" />
          <input type="text" name="note[]" placeholder="備考" class="note">
        </div>
      </div>

      <div class="menu-item">
        <img src="images/kurimusosumomoniku.png" alt="クリームソース鶏もも肉弁当">
        <div class="info">
          <h3>クリームソース鶏もも肉弁当/白醬奶油雞腿排便當</h3>

          <p class="price" data-price="188">金額：188</p>

          <select class="qty" name="qty[]" data-item="クリームソース鶏もも肉弁当/白醬奶油雞腿排便當">
          <option value="0">0</option>
           <option value="1">1</option>
           <option value="2">2</option>
           <option value="3">3</option>
           <option value="4">4</option>
           <option value="5">5</option>
           <option value="6">6</option>
           <option value="7">7</option>
           <option value="8">8</option>
           <option value="9">9</option>
           <option value="10">10</option>
           <option value="other">その他/其他</option>
         </select>
          <input type="number" name="qty_input[]" class="qty-input" style="display:none;" min="0" max="99" value="0" />
          <input type="text" name="note[]" placeholder="備考" class="note">
        </div>
      </div>

      <div class="menu-item">
        <img src="images/torimomoniku.png" alt="鶏もも肉弁当">
        <div class="info">
          <h3>鶏もも肉弁当/經典雞腿排便當</h3>

          <p class="price" data-price="168">金額：168</p>

          <select class="qty" name="qty[]" data-item="鶏もも肉弁当/經典雞腿排便當">
           <option value="0">0</option>
           <option value="1">1</option>
           <option value="2">2</option>
           <option value="3">3</option>
           <option value="4">4</option>
           <option value="5">5</option>
           <option value="6">6</option>
           <option value="7">7</option>
           <option value="8">8</option>
           <option value="9">9</option>
           <option value="10">10</option>
           <option value="other">その他/其他</option>
         </select>
          <input type="number" name="qty_input[]" class="qty-input" style="display:none;" min="0" max="99" value="0" />
          <input type="text" name="note[]" placeholder="備考" class="note">
        </div>
      </div>

      <button type="submit">決定/確定</button>
    </form>
    <p id="response"></p>
  </div>
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <h3>注文内容決定/確認訂單內容</h3>
      <div id="orderSummary"></div>
      <button id="submitOrder" type="button">送ります/送出訂單</button>
      <button onclick="closeModal()" type="button">キャンセル/取消</button>
      </div>
  </div>

  <audio id="clickSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_09c1ffb05d.mp3" preload="auto"></audio>
   
  <div id="finalConfirmModal" class="modal">
    <div class="modal-content">
      <h3>注文しました、ありがとうございます！/訂單已送出，感謝您的訂購！</h3>
      <button onclick="document.getElementById('finalConfirmModal').classList.remove('show')" type="button">確定</button>
      </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
